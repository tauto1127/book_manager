# # Example mutations for a simple movie app
mutation CreateBook(
  $title: String!
  $currentPage: Int!
  $lastPage: Int!
) @auth(level: USER) {
  book_insert(
    data: {
      title: $title
      currentPage: $currentPage
      lastPage: $lastPage
    }
  )
}

